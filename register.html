<!DOCTYPE html>
<html>

<head>
    <title>User Registration - OBTMS</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f9fc;
            margin: 0;
            padding: 0;
        }

        header {
            background: #1a2b4c;
            color: white;
            padding: 15px 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        header h1 {
            margin: 0;
            font-size: 24px;
        }

        header nav a {
            color: white;
            text-decoration: none;
            margin-left: 20px;
            font-weight: bold;
        }

        header nav a:hover {
            text-decoration: underline;
        }

        .main-container {
            display: flex;
            max-width: 1200px;
            margin: 30px auto;
            height: 600px;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 15px rgba(0, 0, 0, 0.2);
        }

        .left-side {
            flex: 1;
            position: relative;
            overflow: hidden;
        }

        .left-side img {
            width: 100%;
            height: 100%;
            object-fit: contain;
            display: none;
        }

        .left-side img.active {
            display: block;
            transition: opacity 0.5s ease-in-out;
        }

        .right-side {
            flex: 1;
            background: #fff;
            padding: 40px 30px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #1a2b4c;
        }

        label {
            display: block;
            margin: 10px 0 5px;
        }

        input {
            width: 100%;
            padding: 8px;
            border-radius: 5px;
            border: 1px solid #ccc;
        }

        button {
            width: 100%;
            padding: 10px;
            margin-top: 20px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 5px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        form {
            width: 100%;
            max-width: 300px;
        }

        .login-link {
            text-align: center;
            margin-top: 20px;
        }

        .login-link a {
            padding: 8px 15px;
            background: #007bff;
            color: #fff;
            border-radius: 5px;
            text-decoration: none;
        }

        .login-link a:hover {
            background: #0056b3;
        }

        .error-msg {
            color: red;
            margin-top: 10px;
            font-weight: bold;
            text-align: center;
        }
    </style>
</head>

<body>

    <header>
        <h1>BusGo</h1>
        <nav>
            <a href="login.html">Login</a>
        </nav>
    </header>

    <div class="main-container" style="background: #1a2b4c;">
        <!-- Left: Image slider -->
        <div class="left-side">
            <img src="image1.jpg" class="active" alt="Slide 1">
            <img src="image2.png" alt="Slide 2">
            <img src="image3.jpg" alt="Slide 3">
        </div>

        <!-- Right: Registration form -->
        <div class="right-side">
            <h2>User Registration</h2>
            <form id="registerForm" action="register.php" method="POST">
                <label for="fullname">Full Name</label>
                <input type="text" name="fullname" id="fullname" required>

                <label for="email">Email Address</label>
                <input type="email" name="email" id="email" required>

                <label for="phone">Phone Number</label>
                <input type="text" name="phone" id="phone" required placeholder="10 digits starting with 9">

                <label for="username">Username</label>
                <input type="text" name="username" id="username" required>

                <label for="password">Password</label>
                <input type="password" name="password" id="password" required
                    placeholder="Min 5 chars, 1 capital, 1 digit, 1 special">

                <label for="confirm_password">Confirm Password</label>
                <input type="password" name="confirm_password" id="confirm_password" required>

                <button type="submit">Register</button>
            </form>

            <p id="error-msg" class="error-msg"></p>

            <div class="login-link">
                <span>Already registered? </span>
                <a href="login.html">Login</a>
            </div>
        </div>
    </div>

    <script>
        // Simple image slider
        let currentIndex = 0;
        const slides = document.querySelectorAll('.left-side img');
        setInterval(() => {
            slides[currentIndex].classList.remove('active');
            currentIndex = (currentIndex + 1) % slides.length;
            slides[currentIndex].classList.add('active');
        }, 3000);

        // Form validation
        document.getElementById('registerForm').addEventListener('submit', function (e) {
            const fullname = document.getElementById('fullname').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirm_password = document.getElementById('confirm_password').value;
            const errorMsg = document.getElementById('error-msg');

            // Full Name Validation
            if (!/^[A-Za-z\s]+$/.test(fullname)) {
                e.preventDefault();
                errorMsg.textContent = "Full Name can only contain letters and spaces.";
                return;
            }

            // Email Validation
            const emailPattern = /^[a-zA-Z0-9._%+-]+@[a-z0-9.-]+\.[a-z]{2,4}$/;
            if (!emailPattern.test(email)) {
                e.preventDefault();
                errorMsg.textContent = "Enter a valid email address.";
                return;
            }

            // Phone Validation
            if (!/^9\d{9}$/.test(phone)) {
                e.preventDefault();
                errorMsg.textContent = "Phone must be 10 digits starting with 9.";
                return;
            }

            // Username Validation
            if (!/^(?=.*[A-Za-z])[A-Za-z0-9@#$%^&*()_+!~`{}[\]:;"'<>,.?\/\\|-]{3,15}$/.test(username)) {
                e.preventDefault();
                errorMsg.textContent = "Username must be 3-15 letters/numbers only.";
                return;
            }

            // Password Validation
            const passPattern = /^(?=.*[A-Z])(?=.*\d)(?=.*[@$!%*?&])[A-Za-z\d@$!%*?&]{5,}$/;
            if (!passPattern.test(password)) {
                e.preventDefault();
                errorMsg.textContent = "Password must be at least 5 chars with 1 capital, 1 digit, 1 special.";
                return;
            }

            // Confirm Password
            if (password !== confirm_password) {
                e.preventDefault();
                errorMsg.textContent = "Passwords do not match.";
                return;
            }

            errorMsg.textContent = ""; // Clear error
        });
    </script>

</body>

</html>
